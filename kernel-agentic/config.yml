# Recommended Configuration for Complex Matrix Multiplication Kernels

# Enhanced configuration specifically tuned for problematic kernels like 2048x2048 matrix multiplication

Pipeline:
  rag_enabled: false  # Disable RAG temporarily - vector store needs to be built first
  online_search: false
  cheat_sheet: true
  omnivise: false
  kernel_lang: hip
  enable_correctness: true  # IMPORTANT: Enable correctness checking
  help_injection: true      # Enable help injection for complex kernels
  mode: pytorch2kernel
  # mode: kernel2kernel
  
  # Enhanced parallel inference for complex kernels
  parallel_inference:
    enabled: true
    models:
      claude_kernel_generator: 3   
      o3_kernel_generator: 3       
    selection_strategy: "best_correct"  # Prioritize correctness for complex kernels
    timeout: 180                    # Longer timeout for complex generation
    max_retries: 3                  
    
    # Enhanced features for complex kernels
    enhanced_mode: true             # Enable complexity analysis and enhanced prompts
    iterative_refinement: true      # Enable iterative refinement for failed kernels
    complexity_threshold: 30.0      # Complexity score threshold for enhanced processing
    
    # Alpha Evolve integration
    alpha_evolve:
      enabled: true                 # Enable Alpha Evolve-style evolutionary improvements
      models: 2                     # Generate more evolved candidates

  search:
    enabled: true
    method: genetic
    patience: 8                     # More patience for complex kernels
    max_trials: 10                  # More trials for optimization
    pop: 20                         # Larger population
    ngen: 25                        # More generations

openai:
  base_url: https://llm-api.amd.com
  api_key: fe76c012dd51448cb0ec5f1e86c298a9
  api_version: 2024-02-01
  embedding_api_version: 2024-02-01
  model_name: GPT-4o
  embedding_model: Text-Embedding-3-Small
  headers:
    Ocp-Apim-Subscription-Key: fe76c012dd51448cb0ec5f1e86c298a9
    user: sirafati
  temperature: 0.1
  public_api_key: null
  local_llm_enabled: false  
  local_llm_base_url: http://127.0.0.1:30000/v1
  
  # Enhanced agent model configurations
  agent_models:
    torch_analyser:
      api_version: 2024-02-01
      model_name: GPT-4o
      temperature: 0.01
    claude_kernel_generator:
      api_version: 2024-12-01-preview
      model_name: Claude-4
      temperature: 0.2              # Slightly more conservative for complex kernels
    o3_kernel_generator:
      api_version: 2024-12-01-preview
      model_name: o3-mini
      temperature: 1.0
      reasoning_effort: "high"      # Maximum reasoning for complex problems

claude:
  timeout: 180                      # Longer timeout for complex kernels
  max_retries: 3
  retry_delay: 2                    # Longer delay between retries

gpu_specs:
  arch: gfx942                      # MI300X specific
  wavefront: 64
  cucount: 304                      # MI300X has 304 CUs
  shared_mem: 65536                 # 64KB LDS per workgroup

eval:
  atol: 1e-2                        # Slightly relaxed for large matrices
  n_trial: 5                        # More trials for stability

stopping:
  min_iters: 3                      # Minimum iterations for complex kernels
  max_iters: 15                     # More iterations allowed
  target_speedup: 1.2               # More achievable target for complex kernels
  min_improvement: 0.03             # Smaller improvements still count
  patience: 6                       # More patience for complex kernels
  max_failures: 6                   # More tolerance for failures

hip:
  gpu_arch: gfx942
  block_size: 256                   # Good default for matrix operations
  n_samples: 3                      # More samples for averaging
  profiler: rocprof-compute         # Options: rocprof, rocprof-compute (rocprof for MI250, rocprof-compute for MI300)
  
  # Example configuration for MI250:
  # gpu_arch: gfx90a
  # profiler: rocprof

rag:
  default_mode: text
  chunk_size: 2048                  # Larger chunks for complex examples
  n_neighbors: 12                   # More neighbors for better context
  min_similarity: 0.6               # Lower threshold for more examples
  top_k: 5                          # More examples in context
  mmr_lambda: 0.7                   # Balance relevance vs diversity

logging:
  history_file: logs/generation_history.jsonl
  log_level: DEBUG                  # Detailed logging for complex kernels

# Additional settings for complex kernels
complexity_handling:
  large_matrix_threshold: 1024      # Matrices larger than this get special handling
  memory_bound_detection: true      # Detect memory-bound operations
  tiling_suggestions: true          # Suggest tiling strategies
  register_optimization: true       # Focus on register allocation
  shared_memory_optimization: true  # Optimize shared memory usage
