# Global configuration
openai:
  base_url: https://llm-api.amd.com
  api_key:  fe76c012dd51448cb0ec5f1e86c298a9                       
  api_version: 2024-12-01-preview
  model_name: o3-mini
  headers:
    Ocp-Apim-Subscription-Key: fe76c012dd51448cb0ec5f1e86c298a9      
    user: sirafati       
  temperature: 0.01

gpu_specs:
  arch: null
  wavefront: null
  cu_count: null
  shared_mem: null
eval:
  n_correctness: 5
  n_trial: 30
  speedup_thresholds: [0,1,2]

stopping:
  min_iters: 2          # never exit earlier than this
  max_iters: 3         # absolute cap (safety valve)
  target_speedup: 2.0   # stop if speedup ≥ 2× baseline
  min_improvement: 0.05 # ε → need ≥5 % latency drop to count as “better”
  patience: 3           # end if no ε-better for these many iterations
  max_failures: 3       # bail if compile/run failed this many times in a row
  
hip:
  gpu_arch: gfx1100
  block_size: 256      
  n_samples: 2
  
rag:
  chunk_size: 1024
  n_neighbors: 8
  similarity_threshold: 0.75
  
logging:
  history_file: logs/generation_history.jsonl
  log_level: INFO


training:
  lora:                
    base_model: openlm-research/open_llama_7b
    r: 16
    alpha: 32
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    epochs: 1
  grpo:          
    baseline_adapter: null     # we might be able to use our LORA adapters...maybe?! 
    num_steps: 800       
    ppo_epochs: 4
    mini_batch_size: 4
    grad_acc_steps: 2
    max_tokens: 1024
    init_kl_coef: 0.2
    target_kl: 6.0
    vf_coef: 0.1
    cliprange_value: 0.2
    lr: 1e-5

autotune:
  use_bayes: true
  use_genetic: true
  max_trials: 30
occupancy:
  enforce_fit: true
bandit:
  epsilon: 0.2
experience:
  k_neighbors: 3
